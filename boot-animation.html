<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DSH // 托卡马克点火序列 · Tokamak Ignition Sequence</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000205; overflow: hidden; }
  body {
    font-family: 'Times New Roman', Times, 'SimSun', '宋体', serif;
    color: #5fe3ff;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Skippable affordance, shown on pointer movement then faded out. */
  #skip {
    position: fixed; right: 22px; bottom: 18px; z-index: 10;
    font-size: 12px; letter-spacing: 0.10em;
    padding: 7px 13px; border: 1px solid rgba(95, 227, 255, 0.45);
    background: rgba(2, 16, 31, 0.72); color: #9df1ff;
    cursor: pointer; user-select: none;
    transition: opacity 0.45s ease, border-color 0.2s ease;
  }
  #skip:hover { border-color: #5fe3ff; }
  #skip kbd {
    font: inherit; color: #fff; border: 1px solid rgba(95, 227, 255, 0.5);
    border-radius: 3px; padding: 1px 5px; margin-left: 5px;
  }
  body.done #skip { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
  <div id="stage"><canvas id="boot"></canvas></div>
  <div id="skip" role="button" tabindex="0">跳过 / SKIP<kbd>Enter</kbd></div>

  <script src="tokamak-boot.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var freeze = params.has('t') ? parseFloat(params.get('t')) : null;
      var loop = params.get('loop') === '1';
      var speed = params.has('speed') ? parseFloat(params.get('speed')) : 1;
      // Rebrand: ?title=YOUR%20PRODUCT&sub=YOUR%20TAGLINE
      var title = params.get('title') || undefined;
      var subtitle = params.get('sub') || undefined;
      var canvas = document.getElementById('boot');
      var skipEl = document.getElementById('skip');

      var boot = TokamakBoot.mount(canvas, {
        freeze: freeze,
        loop: loop,
        speed: speed,
        title: title,
        subtitle: subtitle,
        onDone: function () { document.body.classList.add('done'); }
      });

      // Requirement: the animation can be interrupted at any time with Enter.
      function onKey(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
          e.preventDefault();
          boot.skip();
        }
      }
      window.addEventListener('keydown', onKey);
      skipEl.addEventListener('click', function () { boot.skip(); });

      // Native window close hook, if this is ever hosted in an Electron shell.
      window.DSHBoot = {
        skip: function () { boot.skip(); },
        destroy: function () { boot.destroy(); }
      };
    })();
  </script>
</body>
</html>
